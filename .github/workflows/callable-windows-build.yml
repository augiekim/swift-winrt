on:
  workflow_call:
    inputs:
      config:
        description: "One of: [debug, release] (case-sensitive)"
        type: string
        required: true
      publish-nuget:
        description: "Whether or not to publish the nuget pkg"
        type: boolean
        required: true
      nuget-version:
        description: "3 part version of the nuget package (Major.Minor.Patch)"
        default: "99.99.99"
        type: string
      version_prerelease_identifier:
        description: "Semantic versioning prerelease identifier (including hyphen)"
        default: ""
        type: string
      compare-macos-build:
        description: "Whether to check that the macOS-built swiftwinrt.exe (artifact 'swiftwinrt-macos') generates the same output"
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    name: Build & Test
    env:
      NUGET_PACKAGE_VERSION: ${{ inputs.nuget-version }}${{inputs.version_prerelease_identifier}}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Configure VC++ build for amd64
        uses: compnerd/gha-setup-vsdevenv@5eb3eae1490d4f7875d574c4973539f69109700d # main as of 2025-03-09

      - name: Install Swift toolchain
        uses: compnerd/gha-setup-swift@db4ffac97c2db518c2ff4f37f988af89e4411240
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE

      - name: Configure CMake
        shell: pwsh
        run: |
          $swift = (Get-Command swift).Source
          cmake --preset ${{ inputs.config }} -DSWIFT_VERSION="6.2.0" -DSWIFT_EXE="$swift"

      - name: Build
        run: |
          cmake --build --preset ${{ inputs.config }}
          cmake --build --preset ${{ inputs.config }} --target install
          cmake --build --preset ${{ inputs.config }} --target nuget

      - name: Build optimized swiftwinrt with MSVC
        if: inputs.compare-macos-build && inputs.config != 'release'
        shell: pwsh
        run: |
          $swift = (Get-Command swift).Source
          cmake --preset release -DSWIFT_VERSION="6.2.0" -DSWIFT_EXE="$swift"
          cmake --build --preset release --target swiftwinrt

      - name: Download macOS-built swiftwinrt
        if: inputs.compare-macos-build
        uses: actions/download-artifact@v5
        with:
          name: swiftwinrt-macos
          path: ${{ runner.temp }}\swiftwinrt-macos

      - name: Compare swiftwinrt output across builds
        if: inputs.compare-macos-build
        shell: pwsh
        run: |
          $buildDir = "build\${{ inputs.config }}"
          # Same arguments the build uses, minus -output and -log
          $rsp = Get-Content "$buildDir\tests\test_component\SwiftWinRT.rsp" | Where-Object { $_ -notmatch '^-(output|log)\b' }
          # The first entry is the baseline the others are compared against
          $exes = [ordered]@{ "windows-${{ inputs.config }}" = "$buildDir\swiftwinrt\swiftwinrt.exe" }
          if ("${{ inputs.config }}" -ne "release" -and (Test-Path "build\release\swiftwinrt\swiftwinrt.exe")) {
            $exes["windows-release"] = "build\release\swiftwinrt\swiftwinrt.exe"
          }
          $exes["macos"] = "${{ runner.temp }}\swiftwinrt-macos\swiftwinrt.exe"
          foreach ($name in $exes.Keys) {
            $out = "${{ runner.temp }}\out-$name"
            $rspFile = "${{ runner.temp }}\$name.rsp"
            ($rsp + "-output $out") | Set-Content $rspFile
            & $exes[$name] "@$rspFile"
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              # Re-run under cdb to print the call stack at the first access violation
              $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
              if (Test-Path $cdb) {
                & $cdb -G -lines -c "sxe av; g; .lastevent; kP 50; q" $exes[$name] "@$rspFile"
              }
              throw "$name swiftwinrt.exe failed with exit code $exitCode"
            }
          }
          $names = @($exes.Keys)
          $failed = @()
          foreach ($name in $names[1..($names.Count - 1)]) {
            Write-Host "Comparing $($names[0]) with $name"
            git -c core.autocrlf=false diff --no-index --exit-code --stat "${{ runner.temp }}\out-$($names[0])" "${{ runner.temp }}\out-$name"
            if ($LASTEXITCODE -ne 0) { $failed += $name }
          }
          if ($failed) { throw "Output differs from $($names[0]): $($failed -join ', ')" }
          exit 0

      - name: Upload swiftwinrt logs on failure
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        if: failure()
        with:
          name: swiftwinrt-log
          path: ${{ github.workspace }}\tests\test_component\swiftwinrt.log

      - name: Run test app
        shell: cmd
        run: .\out\${{ inputs.config }}\bin\test_app.exe

      - name: Publish NuGet Package
        uses: actions/upload-artifact@v4
        if: inputs.publish-nuget
        with:
          name: Nuget
          path: ${{ github.workspace }}\build\${{ inputs.config }}\*.nupkg
